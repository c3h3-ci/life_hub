              value: "query-my-coupons"
            - label: "自动领取优惠券"
              value: "auto-bind-coupons"
            - label: "查询账户积分"
              value: "query-my-account"
            - label: "门店专属优惠券"
              value: "query-store-coupons"
            - label: "附近门店查询"
              value: "query-nearby-stores"
            - label: "查询餐品"
              value: "query-meals"
            - label: "查询订单"
              value: "query-order"
            - label: "订单列表"
              value: "order-list"
            - label: "活动日历"
              value: "campaign-calendar"
            - label: "积分商城商品"
              value: "mall-points-products"
            - label: "当前时间信息"
              value: "now-time-info"
    store:
      name: 门店
      description: '门店名称或编码。支持中文名如「福田高铁站」/「领展中心城」，系统自动解析为门店编码。查询餐品(query-meals)/门店优惠券(query-store-coupons)/下单时必填'
      required: false
      selector:
        text:
    product:
      name: 餐品名称
      description: '筛选特定餐品（可选），如「巨无霸」「麦辣鸡腿堡」，仅对查询餐品(query-meals)有效'
      required: false
      selector:
        text:
