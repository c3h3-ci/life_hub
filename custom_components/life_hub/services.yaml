# ========== 统一自然语言查询 ==========

unified_query:
  name: 统一自然语言查询
  description: 一次查询发到多个平台。支持勾选，留空则全查
  fields:
    query:
      name: 查询内容
      description: 传自然语言，如"乐清亚朵酒店标准双人房今晚多少钱"或"温州希尔顿附近有什么好吃的"
      required: true
      selector:
        text:
          multiline: false
    platforms:
      name: 选择平台
      description: 勾选要查询的平台，留空则全查
      required: false
      default: []
      selector:
        select:
          options:
            - label: "携程（酒店·机票·火车票·门票·攻略）"
              value: "携程"
            - label: "飞猪（酒店·机票·火车票·门票·签证）"
              value: "飞猪"
            - label: "美团旅游（酒店·机票·火车票·门票·行程规划）"
              value: "美团旅游"
            - label: "百度地图（AI语义搜地点·路线·天气）"
              value: "百度地图"
            - label: "高德（关键词搜索地点·路线规划·旅游规划）"
              value: "高德"
          multiple: true
    region:
      name: 地区（仅百度地图/美团有用）
      required: false
      default: "全国"
      selector:
        text:
