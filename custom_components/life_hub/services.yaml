      name: 参数
      description: "JSON格式。大部分工具传 {}。query-nearby-stores → {\"beType\":1,\"searchType\":1}"
      required: false
      default: "{}"
      selector:
        object:
    target_device:
      name: 选择账号
      required: false
      selector:
        device:
          integration: life_hub
    subentry_id:
      name: 或输入子条目ID
      required: false
      selector:
        text:

