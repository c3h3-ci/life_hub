# Life Hub Services — 统一命名规范
# 所有服务格式: {provider}_call_tool
# 参数统一: tool + params + target_entity(选择账号传感器) + subentry_id

# ========== Yiming (一鸣) ==========

yiming_call_tool:
  name: 一鸣 API
  description: 查询余额/积分/优惠券/订单等。选择下方账号传感器可指定操作哪个一鸣账号
  fields:
    tool:
      name: 功能
      description: 选择要调用的功能
      required: true
      selector:
        select:
          options:
            - label: "查询余额"
              value: "get_balance"
            - label: "会员信息"
              value: "get_member_info"
            - label: "优惠券汇总"
              value: "get_coupon_sum"
            - label: "积分查询"
              value: "get_integral"
            - label: "积分明细"
              value: "get_integral_detail"
            - label: "最近订单"
              value: "get_orders"
            - label: "我的优惠券"
              value: "get_my_coupons"
            - label: "领取所有可领券"
              value: "receive_all_coupons"
            - label: "批量领所有账号券"
              value: "claim_all"
            - label: "充值记录"
              value: "get_recharge_list"
            - label: "交易明细"
              value: "get_transaction_details"
            - label: "用户信息"
              value: "get_user_info"
            - label: "最近门店"
              value: "get_nearest_store"
            - label: "搜索门店"
              value: "search_stores"
    params:
      name: 参数
      description: "工具参数（JSON格式）。常见示例：get_balance → {}，get_orders → {\"page\":1,\"pageSize\":10}"
      required: false
      default: "{}"
      selector:
        object:
    target_device:
      name: 选择账号
      description: 选择一个一鸣设备来指定操作哪个账号
      required: false
      selector:
        device:
          integration: life_hub
    subentry_id:
      name: 或输入子条目ID
      description: 留空自动选择第一个账号
      required: false
      selector:
        text:

# ========== Fliggy (飞猪) ==========

fliggy_call_tool:
  name: 飞猪 API
  description: 全品类旅行搜索预订。查酒店优先用 fast_search（自然语言），search_hotel 的结构化参数对县级市(如乐清)geocode不准。fast_search → {"query":"乐清亚朵酒店标准双人房今晚价格"}
  fields:
    tool:
      name: 功能
      required: true
      selector:
        select:
          options:
            - label: "快速搜索"
              value: "fast_search"
            - label: "搜索机票"
              value: "search_flight"
            - label: "搜索酒店"
              value: "search_hotel"
            - label: "搜索火车票"
              value: "search_train"
            - label: "搜索景点"
              value: "search_poi"
    params:
      name: 参数
      description: "JSON格式。县级市查酒店用 fast_search（自然语言准确）：{\"query\":\"乐清亚朵酒店标准双人房今晚价格\"}。search_hotel结构化参数对县级市geocode可能不准"
      required: false
      default: "{}"
      selector:
        object:
    target_device:
      name: 选择账号
      required: false
      selector:
        device:
          integration: life_hub
    subentry_id:
      name: 或输入子条目ID
      required: false
      selector:
        text:

# ========== Ctrip (携程) ==========

ctrip_call_tool:
  name: 携程 API
  description: 携程问道AI查询和酒店搜索。用 query 工具加自然语言可查具体房型价格，如{"query":"乐清亚朵酒店标准双人房今晚多少钱"}
  fields:
    tool:
      name: 功能
      required: true
      selector:
        select:
          options:
            - label: "问道AI查询"
              value: "query"
            - label: "搜索酒店"
              value: "search_hotel"
    params:
      name: 参数
      description: "JSON格式。查酒店价格用 query + 自然语言最准：{\"query\":\"乐清亚朵酒店标准双人房今晚多少钱\"}。search_hotel → {\"location\":\"乐清\",\"keyword\":\"亚朵\"}"
      required: false
      default: "{}"
      selector:
        object:
    target_device:
      name: 选择账号
      required: false
      selector:
        device:
          integration: life_hub
    subentry_id:
      name: 或输入子条目ID
      required: false
      selector:
        text:

